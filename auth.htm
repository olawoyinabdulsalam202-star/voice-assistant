<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAIROS — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0F16">
  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/background.css">
  <link rel="stylesheet" href="/components.css">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      /* retokenized onto the design system (design-tokens.css) */
      --cyan: var(--accent-end);
      --cyan-dim: rgba(var(--accent-end-rgb), 0.35);
      --cyan-faint: rgba(var(--accent-end-rgb), 0.08);
      --bg: transparent;
      --panel: var(--glass-fill);
    }

    body {
      min-height: 100vh;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-ui);
      padding: 2.5rem 1rem;
      position: relative;
      overflow: hidden;
      color: var(--text-primary);
    }

    .starfield {
      display: none; /* neutralized — the shared .kx-bg is the only atmosphere */
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 8% 15%, rgba(0, 212, 255, 0.5), transparent),
        radial-gradient(1px 1px at 18% 62%, rgba(0, 212, 255, 0.35), transparent),
        radial-gradient(1px 1px at 30% 25%, rgba(0, 212, 255, 0.4), transparent),
        radial-gradient(1px 1px at 42% 80%, rgba(0, 212, 255, 0.3), transparent),
        radial-gradient(1px 1px at 55% 12%, rgba(0, 212, 255, 0.45), transparent),
        radial-gradient(1px 1px at 66% 55%, rgba(0, 212, 255, 0.3), transparent),
        radial-gradient(1px 1px at 78% 30%, rgba(0, 212, 255, 0.4), transparent),
        radial-gradient(1px 1px at 88% 70%, rgba(0, 212, 255, 0.35), transparent),
        radial-gradient(1px 1px at 94% 18%, rgba(0, 212, 255, 0.3), transparent),
        radial-gradient(1px 1px at 12% 90%, rgba(0, 212, 255, 0.25), transparent),
        radial-gradient(1px 1px at 60% 88%, rgba(0, 212, 255, 0.3), transparent),
        radial-gradient(1px 1px at 25% 45%, rgba(0, 212, 255, 0.25), transparent);
      pointer-events: none;
      opacity: 0.8;
    }

    .circuit-bg {
      display: none; /* neutralized — the shared .kx-bg is the only atmosphere */
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
    }

    .circuit-bg svg {
      width: 100%;
      height: 100%;
    }

    .card {
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-lg);
      width: 100%;
      max-width: 400px;
      padding: 2.6rem 2.2rem 2.2rem;
      position: relative;
      z-index: 1;
      -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(140%);
      backdrop-filter: blur(var(--glass-blur)) saturate(140%);
      box-shadow: var(--shadow-panel);
      animation: cardIn 0.5s ease forwards;
    }

    .card-corner {
      display: none; /* HUD brackets retired in the glass redesign */
      position: absolute;
      width: 22px;
      height: 22px;
      border-color: var(--cyan);
      border-style: solid;
      opacity: 0.9;
      pointer-events: none;
    }

    .card-corner.tl {
      top: -1px;
      left: -1px;
      border-width: 2px 0 0 2px;
      border-top-left-radius: 10px;
    }

    .card-corner.tr {
      top: -1px;
      right: -1px;
      border-width: 2px 2px 0 0;
      border-top-right-radius: 10px;
    }

    .card-corner.bl {
      bottom: -1px;
      left: -1px;
      border-width: 0 0 2px 2px;
      border-bottom-left-radius: 10px;
    }

    .card-corner.br {
      bottom: -1px;
      right: -1px;
      border-width: 0 2px 2px 0;
      border-bottom-right-radius: 10px;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo-area {
      text-align: center;
      margin-bottom: 1.9rem;
    }

    /* Orb now uses the shared .kx-orb component; just center it in the logo area. */
    .logo-area .kx-orb {
      margin: 0 auto 1.1rem;
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 21px;
      font-weight: 400;
      color: var(--text-primary);
      letter-spacing: 6px;
    }

    .logo-sub {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-secondary);
      letter-spacing: 3px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .field-group {
      margin-bottom: 14px;
    }

    .field-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--glass-fill-weak);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-sm);
      padding: 0 13px;
      height: 46px;
      transition: border-color var(--dur-fast) var(--ease-glass), background var(--dur-fast) var(--ease-glass), box-shadow var(--dur-fast) var(--ease-glass);
    }

    .field-wrap:focus-within {
      border-color: rgba(var(--accent-start-rgb), 0.55);
      background: var(--glass-fill);
      box-shadow: 0 0 0 3px rgba(var(--accent-start-rgb), 0.22);
    }

    .field-wrap.error {
      border-color: rgba(var(--danger-rgb), 0.6);
    }

    .field-icon {
      color: var(--text-secondary);
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .field-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: var(--font-ui);
      font-size: 14px;
      height: 100%;
    }

    .field-input::placeholder {
      color: var(--text-tertiary);
    }

    .eye-toggle {
      background: none;
      border: none;
      color: var(--text-tertiary);
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      transition: color var(--dur-fast) var(--ease-glass);
    }

    .eye-toggle:hover {
      color: var(--cyan);
    }

    .row-between {
      display: flex;
      justify-content: flex-end;
      margin: -6px 0 16px;
    }

    .link-small {
      font-size: 11px;
      color: var(--text-secondary);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--font-ui);
      transition: color var(--dur-fast) var(--ease-glass);
    }

    .link-small:hover {
      color: var(--cyan);
      text-decoration: underline;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 16px;
      font-size: 11px;
      color: var(--text-secondary);
    }

    .check-row a {
      color: var(--cyan);
      text-decoration: none;
    }

    .check-row input {
      accent-color: var(--accent-start);
      width: 14px;
      height: 14px;
    }

    .submit-btn {
      width: 100%;
      height: 46px;
      border: none;
      border-radius: var(--glass-radius-sm);
      background: var(--accent-gradient);
      color: var(--text-on-accent);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: var(--glow-accent);
      transition: transform var(--dur-fast) var(--ease-glass), box-shadow var(--dur-fast) var(--ease-glass), filter var(--dur-fast) var(--ease-glass);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 30px rgba(var(--accent-end-rgb), 0.5);
      filter: brightness(1.06);
    }

    .submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .error-msg {
      display: none;
      font-size: 11px;
      color: var(--danger-color);
      letter-spacing: 0.5px;
      margin: -4px 0 12px;
      text-align: center;
    }

    .error-msg.show {
      display: block;
    }

    .status-msg {
      display: none;
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.5px;
      margin: -4px 0 12px;
      text-align: center;
    }

    .status-msg.show {
      display: block;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0 16px;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: var(--glass-border);
    }

    .divider-text {
      font-family: var(--font-mono);
      font-size: 9.5px;
      color: var(--text-tertiary);
      letter-spacing: 2px;
    }

    .social-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: var(--glass-radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--glass-fill-weak);
      color: var(--text-secondary);
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color var(--dur-fast) var(--ease-glass), background var(--dur-fast) var(--ease-glass), color var(--dur-fast) var(--ease-glass);
    }

    .social-btn:hover {
      border-color: rgba(var(--accent-start-rgb), 0.5);
      background: var(--glass-fill);
      color: var(--text-primary);
    }

    .switch-text {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .switch-text button {
      background: none;
      border: none;
      color: var(--cyan);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 11.5px;
      text-decoration: underline;
    }

    .form-pane {
      display: none;
    }

    .form-pane.active {
      display: block;
      animation: paneIn 0.35s ease;
    }

    @keyframes paneIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--glass-fill-strong);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-sm);
      -webkit-backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      box-shadow: var(--shadow-card);
      padding: 10px 18px;
      font-size: 11.5px;
      color: var(--text-primary);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--dur-toast-in) var(--ease-glass), transform var(--dur-toast-in) var(--ease-glass);
      z-index: 10;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 420px) {
      .card {
        padding: 2.2rem 1.5rem 1.8rem;
      }
    }
  </style>
</head>

<body>
  <div class="kx-bg kx-bg--quiet" aria-hidden="true"></div>
  <div class="starfield"></div>
  <div class="circuit-bg">
    <svg viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <g fill="none" stroke="#00d4ff" stroke-width="1">
        <path d="M0 120 H140 V220 H260" />
        <path d="M1000 180 H860 V300 H760 V420" />
        <path d="M0 700 H120 V620 H240 V760" />
        <path d="M1000 650 H880 V520 H780" />
        <path d="M500 0 V90 H600 V180" />
        <path d="M420 1000 V900 H320 V820" />
      </g>
      <g fill="#00d4ff">
        <circle cx="140" cy="120" r="2.5" />
        <circle cx="260" cy="220" r="2.5" />
        <circle cx="760" cy="300" r="2.5" />
        <circle cx="760" cy="420" r="2.5" />
        <circle cx="120" cy="700" r="2.5" />
        <circle cx="240" cy="760" r="2.5" />
        <circle cx="880" cy="650" r="2.5" />
        <circle cx="780" cy="520" r="2.5" />
        <circle cx="600" cy="90" r="2.5" />
        <circle cx="320" cy="900" r="2.5" />
      </g>
    </svg>
  </div>

  <div class="card">
    <div class="card-corner tl"></div>
    <div class="card-corner tr"></div>
    <div class="card-corner bl"></div>
    <div class="card-corner br"></div>
    <div class="logo-area">
      <div class="kx-orb kx-orb--sm"></div>
      <div class="logo-title">KAIROS</div>
      <div class="logo-sub">AI Voice Assistant</div>
    </div>

    <!-- ── LOGIN ── -->
    <div id="login-pane" class="form-pane active">
      <div class="field-group">
        <div class="field-wrap" id="login-email-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-user"/></svg>
          <input class="field-input" id="login-email" type="email" placeholder="Email or username"
            autocomplete="email" />
        </div>
      </div>
      <div class="field-group">
        <div class="field-wrap" id="login-password-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-lock"/></svg>
          <input class="field-input" id="login-password" type="password" placeholder="Password"
            autocomplete="current-password" />
          <button type="button" class="eye-toggle" onclick="togglePw('login-password', this)"><svg
              class="ic"><use href="/icons.svg#ic-eye"/></svg></button>
        </div>
      </div>
      <div class="row-between">
        <button type="button" class="link-small" onclick="showForgot()">Forgot password?</button>
      </div>

      <div class="error-msg" id="login-error"></div>
      <div class="status-msg" id="login-status"></div>

      <button class="submit-btn" id="login-btn" onclick="handleLogin()">Login</button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR CONTINUE WITH</span>
        <div class="divider-line"></div>
      </div>
      <div class="social-row">
        <button class="social-btn" onclick="googleSignIn()" title="Google"><svg class="ic"><use href="/icons.svg#ic-google"/></svg></button>
        <button class="social-btn" onclick="passkeyLogin()" title="Passkey"><svg class="ic"><use href="/icons.svg#ic-fingerprint"/></svg></button>
      </div>

      <div class="switch-text">
        Don't have an account? <button onclick="switchTab('signup')">Sign up</button>
      </div>
    </div>

    <!-- ── SIGNUP ── -->
    <div id="signup-pane" class="form-pane">
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-user"/></svg>
          <input class="field-input" id="signup-name" type="text" placeholder="Full name" />
        </div>
      </div>
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-at"/></svg>
          <input class="field-input" id="signup-email" type="email" placeholder="Email" autocomplete="email" />
        </div>
      </div>
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-lock"/></svg>
          <input class="field-input" id="signup-password" type="password" placeholder="Password" />
          <button type="button" class="eye-toggle" onclick="togglePw('signup-password', this)"><svg
              class="ic"><use href="/icons.svg#ic-eye"/></svg></button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-shield-check"/></svg>
          <input class="field-input" id="signup-confirm" type="password" placeholder="Confirm password" />
          <button type="button" class="eye-toggle" onclick="togglePw('signup-confirm', this)"><svg
              class="ic"><use href="/icons.svg#ic-eye"/></svg></button>
        </div>
      </div>
      <div class="check-row">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to the Terms of Service and Privacy Policy</label>
      </div>

      <div class="error-msg" id="signup-error"></div>
      <div class="status-msg" id="signup-status"></div>

      <button class="submit-btn" id="signup-btn" onclick="handleSignup()">Create account</button>

      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">OR SIGN UP WITH</span>
        <div class="divider-line"></div>
      </div>
      <div class="social-row">
        <button class="social-btn" onclick="googleSignIn()" title="Google"><svg class="ic"><use href="/icons.svg#ic-google"/></svg></button>
        <button class="social-btn" onclick="passkeySignupHint()" title="Passkey"><svg
            class="ic"><use href="/icons.svg#ic-fingerprint"/></svg></button>
      </div>

      <div class="switch-text">
        Already have an account? <button onclick="switchTab('login')">Log in</button>
      </div>
    </div>

    <!-- ── FORGOT PASSWORD ── -->
    <div id="forgot-pane" class="form-pane">
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-at"/></svg>
          <input class="field-input" id="forgot-email" type="email" placeholder="Your account email"
            autocomplete="email" />
        </div>
      </div>
      <div class="error-msg" id="forgot-error"></div>
      <div class="status-msg" id="forgot-status"></div>
      <button class="submit-btn" id="forgot-btn" onclick="handleForgot()">Send reset link</button>
      <div class="switch-text">
        <button onclick="switchTab('login')">Back to login</button>
      </div>
    </div>

    <!-- ── RESET PASSWORD ── -->
    <div id="reset-pane" class="form-pane">
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-lock"/></svg>
          <input class="field-input" id="reset-password" type="password" placeholder="New password" />
          <button type="button" class="eye-toggle" onclick="togglePw('reset-password', this)"><svg
              class="ic"><use href="/icons.svg#ic-eye"/></svg></button>
        </div>
      </div>
      <div class="field-group">
        <div class="field-wrap">
          <svg class="ic field-icon"><use href="/icons.svg#ic-shield-check"/></svg>
          <input class="field-input" id="reset-confirm" type="password" placeholder="Confirm new password" />
          <button type="button" class="eye-toggle" onclick="togglePw('reset-confirm', this)"><svg
              class="ic"><use href="/icons.svg#ic-eye"/></svg></button>
        </div>
      </div>
      <div class="error-msg" id="reset-error"></div>
      <div class="status-msg" id="reset-status"></div>
      <button class="submit-btn" id="reset-btn" onclick="handleReset()">Set new password</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ─────────────────────────────────────────────────────────
    // CONFIG — same origin, since Flask now serves this file directly
    // ─────────────────────────────────────────────────────────
    const API = '';

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2400);
    }

    function showForgot() {
      switchTab('forgot');
    }

    function togglePw(id, btn) {
      const input = document.getElementById(id);
      const isPw = input.type === 'password';
      input.type = isPw ? 'text' : 'password';
      btn.innerHTML = isPw ? '<svg class="ic"><use href="/icons.svg#ic-eye-off"/></svg>' : '<svg class="ic"><use href="/icons.svg#ic-eye"/></svg>';
    }

    // ─────────────────────────────────────────────────────────
    // TAB SWITCH
    // ─────────────────────────────────────────────────────────
    const ALL_PANES = ['login', 'signup', 'forgot', 'reset'];

    function switchTab(tab) {
      ALL_PANES.forEach(t => {
        document.getElementById(t + '-pane').classList.toggle('active', t === tab);
      });
      hideErrors();
    }

    function hideErrors() {
      ['login-error', 'signup-error', 'forgot-error', 'reset-error'].forEach(id => {
        document.getElementById(id).classList.remove('show');
      });
      ['login-status', 'signup-status', 'forgot-status', 'reset-status'].forEach(id => {
        document.getElementById(id).classList.remove('show');
      });
      document.getElementById('login-email-wrap').classList.remove('error');
      document.getElementById('login-password-wrap').classList.remove('error');
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    function showStatus(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    // ─────────────────────────────────────────────────────────
    // LOGIN — POST /api/auth/login
    // ─────────────────────────────────────────────────────────
    let lockoutTimer = null;

    async function handleLogin() {
      hideErrors();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        showError('login-error', 'Enter your email and password.');
        if (!email) document.getElementById('login-email-wrap').classList.add('error');
        if (!password) document.getElementById('login-password-wrap').classList.add('error');
        return;
      }

      document.getElementById('login-btn').disabled = true;
      showStatus('login-status', 'Verifying credentials…');

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById('login-status').classList.remove('show');
          if (data.locked) {
            showError('login-error', data.error);
            let remaining = data.retry_after || 0;
            document.getElementById('login-btn').disabled = true;
            clearInterval(lockoutTimer);
            lockoutTimer = setInterval(() => {
              remaining--;
              if (remaining <= 0) {
                clearInterval(lockoutTimer);
                document.getElementById('login-btn').disabled = false;
                hideErrors();
              } else {
                showError('login-error', `Too many attempts. Try again in ${remaining}s.`);
              }
            }, 1000);
            return;
          }
          showError('login-error', data.error || 'Invalid email or password.');
          document.getElementById('login-email-wrap').classList.add('error');
          document.getElementById('login-password-wrap').classList.add('error');
          document.getElementById('login-btn').disabled = false;
          return;
        }

        localStorage.setItem('kairos_token', data.token);
        localStorage.setItem('kairos_role', data.role);
        localStorage.setItem('kairos_email', data.email);
        localStorage.setItem('kairos_name', data.name || '');
        localStorage.setItem('kairos_preferred_name', data.preferred_name || '');
        localStorage.setItem('kairos_plan', data.plan || 'free');
        localStorage.setItem('kairos_onboarded', data.onboarded ? '1' : '0');

        if (data.role === 'admin') {
          showStatus('login-status', 'Access granted — loading admin panel…');
          setTimeout(() => maybeOfferPasskey(data.email, () => window.location.href = '/admin'), 700);
        } else if (!data.onboarded) {
          showStatus('login-status', 'Access granted — let\'s get you set up…');
          setTimeout(() => maybeOfferPasskey(data.email, () => window.location.href = '/onboarding.htm'), 700);
        } else {
          showStatus('login-status', 'Access granted — loading KAIROS…');
          setTimeout(() => maybeOfferPasskey(data.email, () => window.location.href = '/app'), 700);
        }

      } catch (err) {
        document.getElementById('login-status').classList.remove('show');
        showError('login-error', 'Cannot reach the server. Is the backend running?');
        document.getElementById('login-btn').disabled = false;
      }
    }

    // ─────────────────────────────────────────────────────────
    // SIGNUP — POST /api/auth/signup
    // ─────────────────────────────────────────────────────────
    async function handleSignup() {
      hideErrors();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const terms = document.getElementById('terms').checked;
      const referralCode = new URLSearchParams(window.location.search).get('ref') || '';

      if (!name || !email || !password || !confirm) {
        showError('signup-error', 'All fields are required.');
        return;
      }
      if (password !== confirm) {
        showError('signup-error', 'Passwords do not match.');
        return;
      }
      if (password.length < 8) {
        showError('signup-error', 'Password must be at least 8 characters.');
        return;
      }
      if (!terms) {
        showError('signup-error', 'You must accept the terms to continue.');
        return;
      }

      document.getElementById('signup-btn').disabled = true;
      showStatus('signup-status', 'Creating your account…');

      try {
        const res = await fetch(`${API}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, referral_code: referralCode })
        });

        const data = await res.json();

        if (!res.ok) {
          document.getElementById('signup-status').classList.remove('show');
          showError('signup-error', data.error || 'Registration failed — try again.');
          document.getElementById('signup-btn').disabled = false;
          return;
        }

        showStatus('signup-status', 'Account created — redirecting to login…');
        setTimeout(() => { switchTab('login'); document.getElementById('signup-btn').disabled = false; }, 1100);

      } catch (err) {
        document.getElementById('signup-status').classList.remove('show');
        showError('signup-error', 'Cannot reach the server. Is the backend running?');
        document.getElementById('signup-btn').disabled = false;
      }
    }

    // ─────────────────────────────────────────────────────────
    // FORGOT / RESET PASSWORD — POST /api/auth/forgot-password, /api/auth/reset-password
    // ─────────────────────────────────────────────────────────
    async function handleForgot() {
      hideErrors();
      const email = document.getElementById('forgot-email').value.trim();
      if (!email) { showError('forgot-error', 'Enter your account email.'); return; }

      document.getElementById('forgot-btn').disabled = true;
      showStatus('forgot-status', 'Sending…');

      try {
        const res = await fetch(`${API}/api/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        document.getElementById('forgot-status').classList.remove('show');
        showStatus('forgot-status', data.message || 'If that email is registered, a reset link has been sent.');
      } catch (err) {
        showError('forgot-error', 'Cannot reach the server. Is the backend running?');
      } finally {
        document.getElementById('forgot-btn').disabled = false;
      }
    }

    async function handleReset() {
      hideErrors();
      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;

      if (!password || !confirm) { showError('reset-error', 'Fill in both fields.'); return; }
      if (password !== confirm) { showError('reset-error', 'Passwords do not match.'); return; }
      if (password.length < 8) { showError('reset-error', 'Password must be at least 8 characters.'); return; }

      const token = new URLSearchParams(window.location.search).get('token');
      document.getElementById('reset-btn').disabled = true;
      showStatus('reset-status', 'Updating password…');

      try {
        const res = await fetch(`${API}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password })
        });
        const data = await res.json();

        if (!res.ok) {
          document.getElementById('reset-status').classList.remove('show');
          showError('reset-error', data.error || 'Could not reset password.');
          document.getElementById('reset-btn').disabled = false;
          return;
        }

        showStatus('reset-status', 'Password updated — redirecting to login…');
        setTimeout(() => { window.location.href = '/auth.htm'; }, 1200);
      } catch (err) {
        showError('reset-error', 'Cannot reach the server. Is the backend running?');
        document.getElementById('reset-btn').disabled = false;
      }
    }

    // If the page was opened from a reset-link email (?token=...), jump straight to the reset pane.
    (function checkResetToken() {
      if (new URLSearchParams(window.location.search).get('token')) switchTab('reset');
    })();

    // ─────────────────────────────────────────────────────────
    // SHARED LOGIN COMPLETION — used by Google + passkey logins
    // (password login keeps its own status-message flow above)
    // ─────────────────────────────────────────────────────────
    function completeLogin(data) {
      localStorage.setItem('kairos_token', data.token);
      localStorage.setItem('kairos_role', data.role);
      localStorage.setItem('kairos_email', data.email);
      localStorage.setItem('kairos_name', data.name || '');
      localStorage.setItem('kairos_preferred_name', data.preferred_name || '');
      localStorage.setItem('kairos_plan', data.plan || 'free');
      localStorage.setItem('kairos_onboarded', data.onboarded ? '1' : '0');

      const proceed = () => {
        if (data.role === 'admin') window.location.href = '/admin';
        else if (!data.onboarded) window.location.href = '/onboarding.htm';
        else window.location.href = '/app';
      };

      maybeOfferPasskey(data.email, proceed);
    }

    // Offers to register a passkey right after a successful login, once per account,
    // only on browsers that actually support it. Never blocks the redirect for long.
    function maybeOfferPasskey(email, proceed) {
      const flagKey = 'kairos_passkey_offered_' + email;
      if (!window.PublicKeyCredential || localStorage.getItem(flagKey)) {
        proceed();
        return;
      }
      localStorage.setItem(flagKey, '1');

      const card = document.querySelector('.card');
      const banner = document.createElement('div');
      banner.id = 'passkey-offer-banner';
      banner.style.cssText = 'margin-top:16px;padding:12px;border:1px solid rgba(var(--accent-start-rgb),0.3);border-radius:var(--glass-radius-sm);font-size:11.5px;text-align:center;';
      banner.innerHTML = `
        <div class="pk-msg" style="margin-bottom:10px;color:var(--text-primary);">Add a passkey for faster sign-in next time?</div>
        <button id="pk-add-btn" class="submit-btn" style="margin-bottom:8px;">Add passkey</button>
        <button id="pk-skip-btn" class="link-small" style="display:block;margin:0 auto;">Skip</button>
      `;
      card.appendChild(banner);

      document.getElementById('pk-skip-btn').onclick = proceed;
      document.getElementById('pk-add-btn').onclick = async () => {
        banner.querySelector('.pk-msg').textContent = 'Follow your device\'s prompt…';
        document.getElementById('pk-add-btn').disabled = true;
        try {
          await registerPasskey();
          showToast('Passkey added.');
        } catch (err) {
          showToast('Could not add passkey.');
        }
        proceed();
      };
    }

    // ─────────────────────────────────────────────────────────
    // GOOGLE SIGN-IN — Google Identity Services, verified server-side
    // ─────────────────────────────────────────────────────────
    let GOOGLE_CLIENT_ID = '';
    let googleReady = false;

    function initGoogleSignIn() {
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.onload = () => {
        google.accounts.id.initialize({ client_id: GOOGLE_CLIENT_ID, callback: handleGoogleCredential });
        googleReady = true;
      };
      document.head.appendChild(script);
    }

    async function handleGoogleCredential(response) {
      try {
        const res = await fetch(`${API}/api/auth/google`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ credential: response.credential })
        });
        const data = await res.json();
        if (!res.ok) { showToast(data.error || 'Google sign-in failed.'); return; }
        completeLogin(data);
      } catch (err) {
        showToast('Cannot reach the server.');
      }
    }

    function googleSignIn() {
      if (!GOOGLE_CLIENT_ID) { showToast('Google sign-in isn\'t configured yet.'); return; }
      if (!googleReady) { showToast('Google sign-in is loading — try again in a second.'); return; }
      google.accounts.id.prompt();
    }

    // ─────────────────────────────────────────────────────────
    // PASSKEYS (WebAuthn) — login is usernameless/discoverable;
    // registration happens once a user is already logged in.
    // ─────────────────────────────────────────────────────────
    function passkeySignupHint() {
      showToast('Create your account first — you can add a passkey right after logging in.');
    }

    async function registerPasskey() {
      const token = localStorage.getItem('kairos_token');
      const optRes = await fetch(`${API}/api/auth/webauthn/register/options`, {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (!optRes.ok) throw new Error('options failed');
      const options = await optRes.json();

      const credOptions = PublicKeyCredential.parseCreationOptionsFromJSON(options);
      const credential = await navigator.credentials.create({ publicKey: credOptions });
      const credJSON = credential.toJSON();

      const verifyRes = await fetch(`${API}/api/auth/webauthn/register/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(credJSON)
      });
      if (!verifyRes.ok) throw new Error('verify failed');
    }

    async function passkeyLogin() {
      if (!window.PublicKeyCredential) {
        showToast('Passkeys aren\'t supported on this device or browser.');
        return;
      }
      try {
        const optRes = await fetch(`${API}/api/auth/webauthn/login/options`, { method: 'POST' });
        const options = await optRes.json();
        const challengeKey = options.challengeKey;
        delete options.challengeKey;

        const credOptions = PublicKeyCredential.parseRequestOptionsFromJSON(options);
        const credential = await navigator.credentials.get({ publicKey: credOptions });
        const credJSON = credential.toJSON();
        credJSON.challengeKey = challengeKey;

        const verifyRes = await fetch(`${API}/api/auth/webauthn/login/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(credJSON)
        });
        const data = await verifyRes.json();
        if (!verifyRes.ok) { showToast(data.error || 'Passkey sign-in failed.'); return; }
        completeLogin(data);
      } catch (err) {
        if (err.name === 'NotAllowedError') return; // user cancelled the device prompt
        showToast('Passkey sign-in failed.');
      }
    }

    // ─────────────────────────────────────────────────────────
    // LOAD PUBLIC CONFIG — pulls the Google client ID so social
    // sign-in works as soon as it's set in .env, no HTML edits needed.
    // ─────────────────────────────────────────────────────────
    (async function loadPublicConfig() {
      try {
        const res = await fetch(`${API}/api/config/public`);
        const cfg = await res.json();
        GOOGLE_CLIENT_ID = cfg.google_client_id || '';
        if (GOOGLE_CLIENT_ID) initGoogleSignIn();
      } catch (err) {
        // Social sign-in just won't be available this session — not fatal.
      }
    })();

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('login-pane').classList.contains('active')) handleLogin();
      else if (document.getElementById('signup-pane').classList.contains('active')) handleSignup();
      else if (document.getElementById('forgot-pane').classList.contains('active')) handleForgot();
      else if (document.getElementById('reset-pane').classList.contains('active')) handleReset();
    });
  </script>
</body>

</html>

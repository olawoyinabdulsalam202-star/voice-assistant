<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KAIROS — Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #050e1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      padding: 2rem 1rem;
      position: relative;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px,
          rgba(0, 0, 0, 0.08) 2px, rgba(0, 0, 0, 0.08) 4px);
      pointer-events: none;
    }

    .corner {
      position: fixed;
      width: 28px;
      height: 28px;
      border-color: rgba(0, 200, 255, 0.5);
      border-style: solid;
    }

    .corner-tl {
      top: 16px;
      left: 16px;
      border-width: 2px 0 0 2px;
    }

    .corner-tr {
      top: 16px;
      right: 16px;
      border-width: 2px 2px 0 0;
    }

    .corner-bl {
      bottom: 16px;
      left: 16px;
      border-width: 0 0 2px 2px;
    }

    .corner-br {
      bottom: 16px;
      right: 16px;
      border-width: 0 2px 2px 0;
    }

    .panel {
      background: rgba(5, 20, 40, 0.95);
      border: 1px solid rgba(0, 200, 255, 0.25);
      border-radius: 4px;
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
      position: relative;
      animation: panelIn 0.6s ease forwards;
      z-index: 1;
    }

    @keyframes panelIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .panel::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 20px;
      right: 20px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #00c8ff, transparent);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-ring {
      width: 70px;
      height: 70px;
      border: 2px solid rgba(0, 200, 255, 0.6);
      border-radius: 50%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(0, 200, 255, 0.15);
      }

      50% {
        box-shadow: 0 0 20px 4px rgba(0, 200, 255, 0.12);
      }
    }

    .logo-ring::before {
      content: '';
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 50%;
    }

    .logo-j {
      font-family: 'Orbitron', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #00c8ff;
      letter-spacing: 2px;
    }

    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #00c8ff;
      letter-spacing: 8px;
    }

    .logo-sub {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.4);
      letter-spacing: 3px;
      margin-top: 5px;
    }

    .tabs {
      display: flex;
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 3px;
      margin-bottom: 1.8rem;
      overflow: hidden;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      background: transparent;
      border: none;
      color: rgba(0, 200, 255, 0.4);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
    }

    .tab-btn.active {
      background: rgba(0, 200, 255, 0.1);
      color: #00c8ff;
      border-bottom: 2px solid #00c8ff;
    }

    .tab-btn:hover:not(.active) {
      background: rgba(0, 200, 255, 0.05);
      color: rgba(0, 200, 255, 0.7);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1.4rem;
      padding: 8px 12px;
      background: rgba(0, 200, 255, 0.04);
      border: 1px solid rgba(0, 200, 255, 0.1);
      border-radius: 3px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00c8ff;
      animation: blink 1.4s ease infinite;
      flex-shrink: 0;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.15;
      }
    }

    .status-text {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.5);
      letter-spacing: 1.5px;
      flex: 1;
    }

    .progress-bar {
      height: 1px;
      background: rgba(0, 200, 255, 0.1);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 1.6rem;
    }

    .progress-fill {
      height: 100%;
      width: 55%;
      background: #00c8ff;
      animation: scan 2.2s ease-in-out infinite;
    }

    @keyframes scan {
      0% {
        transform: translateX(-120%);
      }

      100% {
        transform: translateX(250%);
      }
    }

    .field-group {
      margin-bottom: 1.2rem;
    }

    .field-label {
      display: block;
      font-size: 10px;
      letter-spacing: 2px;
      color: rgba(0, 200, 255, 0.5);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .field-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .field-icon {
      position: absolute;
      left: 11px;
      color: rgba(0, 200, 255, 0.4);
      font-size: 15px;
    }

    .field-input {
      width: 100%;
      background: rgba(0, 200, 255, 0.04);
      border: 1px solid rgba(0, 200, 255, 0.2);
      border-radius: 3px;
      padding: 10px 10px 10px 36px;
      color: #a0e8ff;
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }

    .field-input::placeholder {
      color: rgba(0, 200, 255, 0.2);
    }

    .field-input:focus {
      border-color: rgba(0, 200, 255, 0.6);
      background: rgba(0, 200, 255, 0.07);
    }

    /* Error state */
    .field-input.error {
      border-color: rgba(255, 60, 60, 0.6);
    }

    .error-msg {
      display: none;
      font-size: 10px;
      letter-spacing: 1px;
      color: #ff4444;
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(255, 60, 60, 0.08);
      border: 1px solid rgba(255, 60, 60, 0.2);
      border-radius: 3px;
    }

    .error-msg.show {
      display: block;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: transparent;
      border: 1px solid rgba(0, 200, 255, 0.5);
      border-radius: 3px;
      color: #00c8ff;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 4px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .submit-btn:hover {
      background: rgba(0, 200, 255, 0.08);
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: rgba(0, 200, 255, 0.1);
    }

    .divider-text {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.3);
      letter-spacing: 2px;
    }

    .biometric-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px solid rgba(0, 200, 255, 0.15);
      border-radius: 3px;
      color: rgba(0, 200, 255, 0.45);
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .biometric-btn:hover {
      border-color: rgba(0, 200, 255, 0.35);
      color: rgba(0, 200, 255, 0.7);
      background: rgba(0, 200, 255, 0.04);
    }

    .form-pane {
      display: none;
    }

    .form-pane.active {
      display: block;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.2rem;
    }

    .check-row input[type=checkbox] {
      accent-color: #00c8ff;
      width: 13px;
      height: 13px;
    }

    .check-row label {
      font-size: 10px;
      color: rgba(0, 200, 255, 0.4);
      letter-spacing: 1px;
      cursor: pointer;
    }

    .footer-text {
      text-align: center;
      font-size: 10px;
      color: rgba(0, 200, 255, 0.2);
      letter-spacing: 1.5px;
      margin-top: 1.4rem;
    }
  </style>
</head>

<body>

  <div class="grid-bg"></div>
  <div class="scanline"></div>
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="panel">
    <div class="logo-area">
      <div class="logo-ring"><span class="logo-j">k</span></div>
      <div class="logo-title">KAIROS</div>
      <div class="logo-sub">voice assistant system</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Access</button>
      <button class="tab-btn" onclick="switchTab('signup')">Register</button>
    </div>

    <div class="status-bar">
      <div class="status-dot" id="status-dot"></div>
      <span class="status-text" id="status-msg">SYSTEM ONLINE — AWAITING CREDENTIALS</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>

    <!-- ── LOGIN ── -->
    <div id="login-pane" class="form-pane active">
      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <i class="ti ti-user field-icon"></i>
          <input class="field-input" id="login-email" type="email" placeholder="enter email" autocomplete="email" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <i class="ti ti-lock field-icon"></i>
          <input class="field-input" id="login-password" type="password" placeholder="••••••••••••"
            autocomplete="current-password" />
        </div>
      </div>
      <div class="error-msg" id="login-error">ACCESS DENIED — INVALID CREDENTIALS</div>
      <button class="submit-btn" id="login-btn" onclick="handleLogin()">Authenticate</button>
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-text">or</span>
        <div class="divider-line"></div>
      </div>
      <button class="biometric-btn">
        <i class="ti ti-fingerprint" style="font-size:17px;"></i>
        <span>Biometric Access</span>
      </button>
    </div>

    <!-- ── SIGNUP ── -->
    <div id="signup-pane" class="form-pane">
      <div class="field-group">
        <label class="field-label">Full Name</label>
        <div class="field-wrap">
          <i class="ti ti-user field-icon"></i>
          <input class="field-input" id="signup-name" type="text" placeholder="enter full name" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Email</label>
        <div class="field-wrap">
          <i class="ti ti-at field-icon"></i>
          <input class="field-input" id="signup-email" type="email" placeholder="enter email" autocomplete="email" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Password</label>
        <div class="field-wrap">
          <i class="ti ti-lock field-icon"></i>
          <input class="field-input" id="signup-password" type="password" placeholder="create password" />
        </div>
      </div>
      <div class="field-group">
        <label class="field-label">Confirm Password</label>
        <div class="field-wrap">
          <i class="ti ti-shield field-icon"></i>
          <input class="field-input" id="signup-confirm" type="password" placeholder="confirm password" />
        </div>
      </div>
      <div class="check-row">
        <input type="checkbox" id="terms" />
        <label for="terms">I agree to system access terms</label>
      </div>
      <div class="error-msg" id="signup-error"></div>
      <button class="submit-btn" id="signup-btn" onclick="handleSignup()">Initialize Account</button>
    </div>

    <div class="footer-text">KAIROS v2.0 &nbsp;|&nbsp; ENCRYPTED CHANNEL &nbsp;|&nbsp; 256-BIT</div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────
    // CONFIG — your Flask backend URL
    // ─────────────────────────────────────────────────────────
    const API = '';  // empty = same origin. Change to 'http://localhost:5000' if running separately

    // ─────────────────────────────────────────────────────────
    // TAB SWITCH
    // ─────────────────────────────────────────────────────────
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
      });
      document.getElementById('login-pane').classList.toggle('active', tab === 'login');
      document.getElementById('signup-pane').classList.toggle('active', tab === 'signup');
      setStatus(tab === 'login' ? 'SYSTEM ONLINE — AWAITING CREDENTIALS' : 'NEW USER REGISTRATION PROTOCOL', 'blue');
      hideErrors();
    }

    // ─────────────────────────────────────────────────────────
    // STATUS HELPERS
    // ─────────────────────────────────────────────────────────
    function setStatus(msg, color) {
      document.getElementById('status-msg').textContent = msg;
      const dot = document.getElementById('status-dot');
      const colors = { blue: '#00c8ff', yellow: '#ffcc00', green: '#00ff88', red: '#ff4444' };
      dot.style.background = colors[color] || '#00c8ff';
    }

    function hideErrors() {
      document.getElementById('login-error').classList.remove('show');
      document.getElementById('signup-error').classList.remove('show');
      document.querySelectorAll('.field-input').forEach(i => i.classList.remove('error'));
    }

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('show');
    }

    // ─────────────────────────────────────────────────────────
    // LOGIN
    // Calls POST /api/auth/login on your Flask backend
    // Backend checks:
    //   1. If email === ADMIN_EMAIL and password === ADMIN_PASSWORD → returns { role: 'admin', token: '...' }
    //   2. Else checks Supabase → returns { role: 'user', token: '...' }
    // ─────────────────────────────────────────────────────────
    async function handleLogin() {
      hideErrors();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;

      if (!email || !password) {
        setStatus('INPUT FIELDS INCOMPLETE', 'yellow');
        if (!email) document.getElementById('login-email').classList.add('error');
        if (!password) document.getElementById('login-password').classList.add('error');
        return;
      }

      setStatus('VERIFYING CREDENTIALS...', 'yellow');
      document.getElementById('login-btn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus('ACCESS DENIED', 'red');
          showError('login-error', data.error || 'ACCESS DENIED — INVALID CREDENTIALS');
          document.getElementById('login-email').classList.add('error');
          document.getElementById('login-password').classList.add('error');
          return;
        }

        // ── Store session ──
        // data = { token, role, user_id, email }
        localStorage.setItem('kairos_token', data.token);
        localStorage.setItem('kairos_role', data.role);
        localStorage.setItem('kairos_email', data.email);

        if (data.role === 'admin') {
          // ── ADMIN → go to admin page ──
          setStatus('ADMIN ACCESS GRANTED — LOADING CONTROL CENTER', 'green');
          setTimeout(() => window.location.href = 'admin.html', 1000);
        } else {
          // ── Normal user → go to main app ──
          setStatus('ACCESS GRANTED — INITIALIZING KAIROS', 'green');
          setTimeout(() => window.location.href = 'index.html', 1000);
        }

      } catch (err) {
        setStatus('CONNECTION ERROR — RETRY', 'red');
        showError('login-error', 'CANNOT REACH SERVER. IS FLASK RUNNING?');
      } finally {
        document.getElementById('login-btn').disabled = false;
      }
    }

    // ─────────────────────────────────────────────────────────
    // SIGNUP
    // Calls POST /api/auth/signup on your Flask backend
    // ─────────────────────────────────────────────────────────
    async function handleSignup() {
      hideErrors();
      const name = document.getElementById('signup-name').value.trim();
      const email = document.getElementById('signup-email').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      const terms = document.getElementById('terms').checked;

      if (!name || !email || !password || !confirm) {
        setStatus('ALL FIELDS REQUIRED', 'yellow');
        return;
      }
      if (password !== confirm) {
        showError('signup-error', 'PASSWORDS DO NOT MATCH');
        document.getElementById('signup-password').classList.add('error');
        document.getElementById('signup-confirm').classList.add('error');
        return;
      }
      if (password.length < 8) {
        showError('signup-error', 'PASSWORD MUST BE AT LEAST 8 CHARACTERS');
        return;
      }
      if (!terms) {
        showError('signup-error', 'YOU MUST ACCEPT THE TERMS');
        return;
      }

      setStatus('INITIALIZING NEW USER PROTOCOL...', 'yellow');
      document.getElementById('signup-btn').disabled = true;

      try {
        const res = await fetch(`${API}/api/auth/signup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          setStatus('REGISTRATION FAILED', 'red');
          showError('signup-error', data.error || 'REGISTRATION FAILED — TRY AGAIN');
          return;
        }

        setStatus('ACCOUNT CREATED — PLEASE LOG IN', 'green');
        setTimeout(() => switchTab('login'), 1200);

      } catch (err) {
        setStatus('CONNECTION ERROR — RETRY', 'red');
        showError('signup-error', 'CANNOT REACH SERVER. IS FLASK RUNNING?');
      } finally {
        document.getElementById('signup-btn').disabled = false;
      }
    }

    // Enter key support
    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (document.getElementById('login-pane').classList.contains('active')) handleLogin();
      else handleSignup();
    });
  </script>
</body>

</html>

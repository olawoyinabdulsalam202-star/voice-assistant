<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — KAIROS</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0F16">
  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/background.css">
  <link rel="stylesheet" href="/components.css">
  <style>
    :root {
      /* retokenized onto the design system (design-tokens.css) */
      --cyan: var(--accent-end);
      --purple: var(--accent-start);
      --green: var(--ok-color);
      --gold: var(--warn-color);
      --dark: transparent;
      --card: var(--glass-fill);
      --border: var(--glass-border);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
    }

    * { margin: 0; padding: 0; box-sizing: border-box }

    body {
      font-family: var(--font-ui);
      background: var(--dark);
      color: var(--text);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* page-specific hued wash neutralized — the shared .kx-bg is the only atmosphere */
    .bg-fade {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: none;
      pointer-events: none;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(13, 15, 22, 0.72);
      -webkit-backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      border-bottom: 1px solid var(--border);
      padding: 1.1rem 2rem;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: .95rem;
      font-weight: 900;
      letter-spacing: .28rem;
      color: var(--text-primary);
      text-decoration: none;
    }

    .nav-back {
      font-family: var(--font-mono);
      font-size: .68rem;
      letter-spacing: .12rem;
      color: var(--muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: var(--glass-radius-pill);
      padding: .45rem 1.1rem;
      transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
    }

    .nav-back:hover {
      color: var(--text-primary);
      border-color: var(--glass-highlight);
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 780px;
      margin: 0 auto;
      padding: 5rem 2rem 6rem;
      flex: 1;
      width: 100%;
    }

    .doc-tag {
      font-family: var(--font-mono);
      font-size: .6rem;
      color: var(--cyan);
      letter-spacing: .4rem;
      text-transform: uppercase;
      display: block;
      margin-bottom: 1rem;
      text-align: center;
    }

    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 700;
      letter-spacing: .05rem;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      margin-bottom: .8rem;
      text-align: center;
    }

    .sub {
      font-size: 1rem;
      color: var(--muted);
      text-align: center;
      max-width: 480px;
      margin: 0 auto 3.5rem;
    }

    .team-strip {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8rem;
      margin-bottom: 3.5rem;
    }

    .team-mark {
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }

    .team-mark img {
      width: 100%;
      height: 100%;
      display: block;
    }

    .team-name {
      font-family: var(--font-display);
      font-size: .82rem;
      letter-spacing: .12rem;
      color: var(--text-primary);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      align-items: stretch;
    }

    .contact-card {
      background: var(--glass-fill);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-lg);
      -webkit-backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      backdrop-filter: blur(var(--glass-blur-sm)) saturate(140%);
      padding: 2.2rem 2rem;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 1.3rem;
      transition: transform var(--dur-panel) var(--ease-glass), border-color var(--dur-panel) var(--ease-out), box-shadow var(--dur-panel) var(--ease-out);
      position: relative;
      overflow: hidden;
    }

    .contact-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      transition: left .6s ease;
    }

    .contact-card:hover {
      border-color: var(--glass-highlight);
      transform: translateY(-6px);
      box-shadow: var(--shadow-panel), 0 0 40px rgba(var(--accent-end-rgb), .1);
    }

    .contact-card:hover::after {
      left: 100%;
    }

    .contact-icon {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      color: var(--cyan);
      filter: drop-shadow(0 0 10px rgba(var(--accent-end-rgb), .4));
    }

    .contact-icon.wa {
      color: var(--green);
      filter: drop-shadow(0 0 10px rgba(var(--ok-rgb), .4));
    }

    .contact-text .label {
      font-family: var(--font-mono);
      font-size: .58rem;
      letter-spacing: .25rem;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .4rem;
      display: block;
    }

    .contact-text .value {
      font-family: var(--font-ui);
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-primary);
      word-break: break-word;
    }

    .contact-card:hover .contact-text .value {
      color: var(--cyan);
    }

    .contact-card.wa:hover .contact-text .value {
      color: var(--green);
    }

    .note {
      margin-top: 2.5rem;
      font-family: var(--font-mono);
      font-size: .68rem;
      color: var(--muted);
      letter-spacing: .05rem;
      text-align: center;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 2rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .foot-copy {
      font-family: var(--font-mono);
      color: var(--muted);
      font-size: .62rem;
      letter-spacing: .1rem;
    }
  </style>
</head>

<body>
  <div class="kx-bg" aria-hidden="true"></div>
  <div class="bg-fade"></div>

  <nav>
    <div class="nav-inner">
      <a href="main.htm?skip_intro=1" class="nav-logo">KAIROS</a>
      <a href="main.htm?skip_intro=1" class="nav-back">← Back to Home</a>
    </div>
  </nav>

  <main>
    <span class="doc-tag">// get in touch</span>
    <h1>Contact Us</h1>
    <p class="sub">Reach the team directly — no forms, no queues. Pick whichever channel works best for you.</p>

    <div class="team-strip">
      <div class="team-mark"><img src="/kairos-mark.svg" alt="Kairos" width="46" height="46"></div>
      <span class="team-name">KAIROS TEAM</span>
    </div>

    <div class="contact-grid">
      <a href="mailto:kairosva.team@gmail.com" class="contact-card">
        <svg class="contact-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="7" width="24" height="18" rx="2"/>
          <path d="M5 9l11 9 11-9"/>
        </svg>
        <div class="contact-text">
          <span class="label">Email</span>
          <span class="value">kairosva.team@gmail.com</span>
        </div>
      </a>

      <a href="https://wa.me/2348140399587" target="_blank" rel="noopener" class="contact-card wa">
        <svg class="contact-icon wa" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 26l1.7-5A11 11 0 1 1 14 24l-6 2Z"/>
          <path d="M11.5 12.5c0 5 4 9 9 9 .8 0 1.5-.8 1.5-1.6 0-.3-.1-.6-.3-.8l-2-2a1 1 0 0 0-1.2-.2l-1 .6a7 7 0 0 1-3-3l.6-1a1 1 0 0 0-.2-1.2l-2-2a1.1 1.1 0 0 0-.8-.3c-.8 0-1.6.7-1.6 1.5Z"/>
        </svg>
        <div class="contact-text">
          <span class="label">WhatsApp</span>
          <span class="value">+234 814 039 9587</span>
        </div>
      </a>
    </div>

    <p class="note">// we typically respond within 24 hours</p>
  </main>

  <footer>
    <p class="foot-copy">© 2026 Elite Dev — Mr. Abdulsalam</p>
  </footer>

  <script>
    /* If the reader arrived here from Settings, the Back control returns to
       Settings (where they clicked) instead of the landing page. Detected via
       the same-origin referrer — Settings loads at /settings. Every other
       entry point keeps the original "Back to Home" link untouched. */
    (function () {
      try {
        var ref = document.referrer;
        if (!ref) return;
        var u = new URL(ref);
        if (u.origin !== location.origin) return;
        if (!/(^|\/)settings\b/i.test(u.pathname)) return;
        var back = document.querySelector('a.nav-back');
        if (!back) return;
        back.setAttribute('href', '/settings');
        back.textContent = '← Back to Settings';
      } catch (e) { /* keep the default Home link */ }
    })();
  </script>
</body>

</html>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- ══════════════════════════════════════════════════════════════════
     KAIROS ICON SPRITE
     One thin-line (1.5px) symbol per icon. viewBox 0 0 24 24.
     Presentation attrs live on each <symbol> and inherit into paths;
     stroke="currentColor" lets any host element tint the icon.
     Reference from HTML or JS with a root-absolute href (works from
     /app and the /app/new sub-path alike):
       <svg class="ic"><use href="/icons.svg#ic-bell"/></svg>
     ══════════════════════════════════════════════════════════════════ -->


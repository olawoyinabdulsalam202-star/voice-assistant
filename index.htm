<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kairos</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <!-- Design system: tokens → atmosphere → components, then this page's own style.css. style.css is linked... -->
  <link rel="stylesheet" href="/design-tokens.css">
  <link rel="stylesheet" href="/background.css">
  <link rel="stylesheet" href="/components.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0D0F16">

  <style>
    html,
    body {
      background: var(--bg-base-start, #06070B) !important;
      margin: 0;
      padding: 0;
    }

  </style>
</head>

<body>
  <!-- Universal dark atmosphere: gradient + faint grain + soft accent glow. Sits at z-index:-10, behind th... -->
  <div class="kx-bg" aria-hidden="true"></div>

  <script src="Onboarding.js"></script>

  <!-- APP INTERFACE -->
  <div id="startup-status" hidden>
    <div id="fallback">
      <div>▶ INITIALIZING SYSTEM CORE...</div>
      <div>▶ LOADING NEURAL PROTOCOLS...</div>
      <div>▶ CALIBRATING INTERFACE MATRIX...</div>
      <div>▶ ACTIVATING SENSORY ARRAYS...</div>
      <div>▶ ONLINE</div>
    </div>
  </div>
  <!-- ATMOSPHERE The shared .kx-bg above (gradient + grain + accent glow) is the only background, matching... -->

  <!-- LEFT HUD — CLOCK -->
  <div id="hud-left">
    <div id="hud-time">00:00:00</div>
    <div class="hud-divider"></div>
    <div id="hud-date"></div>
  </div>

  <!-- BOTTOM HUD DOCK — one calm glass bar holding every utility control. The two groups #hud-right-top /... -->
  <div id="hud-dock" class="kx-hud-dock">

    <!-- Pure-CSS open/close state for the phone "more" sheet (no JS). Kept first so the :checked ~ sibling s... -->
    <input type="checkbox" id="hud-more-toggle" class="kx-more-toggle" tabindex="-1">

    <!-- ••• trigger — phones only. A <label> (not a <button>) so it flips the checkbox above without script; styled as a dock button. -->
    <label for="hud-more-toggle" id="hud-more-btn" class="kx-dock-btn"
           aria-label="More controls" aria-controls="hud-right-top">
      <svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-dots"/></svg><span>MORE</span>
    </label>

    <!-- tap-away scrim — phones only. A <label> so tapping outside closes. -->
    <label for="hud-more-toggle" class="kx-more-backdrop" aria-hidden="true"></label>

    <!-- PRIMARY — Text · Reminders · Settings (the phone bar) -->
    <div id="hud-right-bottom">
      <button id="txt-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-text"/></svg><span>TXT</span></button>
      <button id="rem-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-bell"/></svg><span>REM</span></button>
      <button id="set-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-gear"/></svg><span>SET</span></button>
    </div>

    <!-- SECONDARY — Camera · Screen · Device · Log · Memory · File (the sheet) -->
    <div id="hud-right-top">
      <button id="cam-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-camera"/></svg><span>CAM</span></button>
      <button id="screen-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-screen"/></svg><span>SCR</span></button>
      <button id="device-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-device"/></svg><span>DEV</span></button>
      <button id="hist-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-history"/></svg><span>LOG</span></button>
      <button id="mem-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-memory"/></svg><span>MEM</span></button>
      <button id="file-btn" class="kx-dock-btn"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-file"/></svg><span>FILE</span></button>
    </div>
  </div>

  <!-- HISTORY PANEL -->
  <div id="history-panel">
    <div class="hist-header">
      <span><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-history"/></svg> CONVERSATION LOG</span>
      <button class="hist-close" onclick="toggleHistory()" aria-label="Close conversation log"><svg class="ic" aria-hidden="true"><use href="/icons.svg#ic-x"/></svg></button>
    </div>
    <div class="hist-actions">
      <button class="hist-action" onclick="startNewConversation()"><svg class="ic ic--sm" aria-hidden="true"><use href="/icons.svg#ic-plus"/></svg><span>NEW CHAT</span></button>
      <button class="hist-action" onclick="toggleConversationList()" id="convListToggle"><svg class="ic ic--sm" aria-hidden="true"><use href="/icons.svg#ic-menu"/></svg><span>ALL CHATS</span></button>
    </div>
    <div id="conversation-list" style="display:none;"></div>
    <div id="history-list"></div>
  </div>

  <!-- CAMERA FEED -->
  <video id="cam-feed" autoplay playsinline></video>

  <!-- MAIN INTERFACE -->
  <div id="interface">

    <div class="hud-outer">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="orb" id="orb"></div>
    </div>

    <p id="greeting"></p>
    <p id="status"></p>

    <!-- MIC MUTE (M1) Placed next to the orb rather than in the right-hand HUD stack, which already overflow... -->
    <button id="mic-mute-btn" type="button"
            aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
      <svg class="mic-icon mic-on" viewBox="0 0 24 24" fill="none" aria-hidden="true"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v1a7 7 0 0 1-14 0v-1"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
      <svg class="mic-icon mic-off" viewBox="0 0 24 24" fill="none" aria-hidden="true"
           stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 9V5a3 3 0 0 1 5.94-.6"/>
        <path d="M15 11.6V11"/>
        <path d="M19 10v1a7 7 0 0 1-10.7 5.98"/>
        <path d="M5 10v1a7 7 0 0 0 2.05 4.95"/>
        <line x1="12" y1="18" x2="12" y2="22"/>
        <line x1="8" y1="22" x2="16" y2="22"/>
        <line x1="3" y1="3" x2="21" y2="21"/>
      </svg>
    </button>
  </div>

  <!-- BOTTOM STRIP — live network-signal indicator. Setings.js (updateSignalDisplay) finds the span contai... -->
  <div class="data-strip" id="strip">
    <span>NET: ACTIVE</span>
  </div>


  <!-- LOAD ORDER MATTERS brain.js defines askKairos / askKairosStream. Memory, Multilang and Filereader ea... -->
  <script src="brain.js"></script>
  <script src="script.js"></script>
  <script src="ai.js"></script>
  <script src="weather.js"></script>
  <script src="Memory.js"></script>
  <script src="Multilang.js"></script>
  <script src="Filereader.js"></script>
  <script src="Setings.js"></script>
  <script src="text.js"></script>
  <script src="dropdown.js"></script>

  <script>
    // Section.
    // Wake words, shortcuts, limits and UI copy now come from the server
    // so the admin panel can change them without a deploy. Previously
    // persona.json held a wake_word that script.js completely ignored,
    // so the admin editor wrote to a field nothing ever read.
    window.KAIROS_CONFIG_READY = (async function () {
      try {
        const r = await fetch('/api/config/public');
        if (!r.ok) return null;
        const cfg = await r.json();
        window.KAIROS_CONFIG    = cfg;
        window.KAIROS_WAKE      = cfg.wake      || {};
        window.KAIROS_SHORTCUTS = cfg.shortcuts || {};
        window.KAIROS_UI        = cfg.ui        || {};
        window.KAIROS_LIMITS    = cfg.limits    || {};
        return cfg;
      } catch (e) {
        // Offline or backend down — modules fall back to their built-in
        // defaults rather than breaking.
        console.warn('Config fetch failed, using defaults:', e);
        return null;
      }
    })();

    // Section.
    setInterval(() => {
      const now = new Date();
      const timeEl = document.getElementById('hud-time');
      const dateEl = document.getElementById('hud-date');
      const clockEl = document.getElementById('clock');
      if (timeEl) timeEl.textContent = now.toTimeString().slice(0, 8);
      if (clockEl) clockEl.textContent = now.toTimeString().slice(0, 8);
      if (dateEl) dateEl.textContent = now.toDateString().toUpperCase();
    }, 1000);

    // Section.
    document.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver(() => {
        if (document.getElementById('interface').classList.contains('visible')) {
          document.getElementById('hud-left').classList.add('show');
          document.getElementById('hud-right-top').classList.add('show');
          document.getElementById('hud-right-bottom').classList.add('show');
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('interface'), { attributes: true });
    });

    // Section.
    window.addEventListener('load', () => {
      document.getElementById('cam-btn')?.addEventListener('click', () => toggleCamera());
      document.getElementById('screen-btn')?.addEventListener('click', () => toggleScreenShare());
      document.getElementById('device-btn')?.addEventListener('click', () => toggleDevicePanel());
      document.getElementById('hist-btn')?.addEventListener('click', () => toggleHistory());
      document.getElementById('rem-btn')?.addEventListener('click', () => window.kairosReminders?.togglePanel());
      document.getElementById('mem-btn')?.addEventListener('click', () => window.kairosMemory?.togglePanel());
      document.getElementById('file-btn')?.addEventListener('click', () => window.kairosFiles?.togglePanel());
      document.getElementById('set-btn')?.addEventListener('click', () => window.openKairosSettings?.());
      document.getElementById('txt-btn')?.addEventListener('click', () => window.kairosTextMode?.togglePanel());

      // M1 — mic mute
      document.getElementById('mic-mute-btn')?.addEventListener('click', () => {
        window.kairosMic?.toggle();
      });
    });

    // Section.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(() => { });
    }
  </script>
</body>

</html>
